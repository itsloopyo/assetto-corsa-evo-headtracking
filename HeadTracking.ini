; Assetto Corsa EVO Head Tracking - configuration
; Edit values, restart the game to apply.
;
; Controls (all remappable, see [Hotkeys]):
;           Home / Ctrl+Shift+T   recenter
;           End  / Ctrl+Shift+Y   toggle tracking
;           PgUp / Ctrl+Shift+G   cycle tracking mode (rotation and position
;                                 / rotation only / position only)
;           PgDn / Ctrl+Shift+H   toggle yaw mode (world / camera-local)

[Network]
UdpPort=4242

[General]
EnableOnStartup=1
; 1 turns the head about the world's up axis, so the axis stays level with
; the horizon through a banked corner. 0 turns it about the camera's own up
; axis, so the view leans with the car.
WorldSpaceYaw=1

[Hotkeys]
; Windows virtual key codes, in hex. Each action has a nav-cluster key and a
; Ctrl+Shift+<key> chord, and both fire it - remap either or both.
; Common codes: Home 0x24, End 0x23, Insert 0x2D, Delete 0x2E, PgUp 0x21,
; PgDn 0x22, F1-F12 0x70-0x7B, A-Z 0x41-0x5A, numpad 0-9 0x60-0x69.
RecenterKey=0x24
ToggleKey=0x23
CycleModeKey=0x21
YawModeKey=0x22
ChordRecenterKey=0x54
ChordToggleKey=0x59
ChordCycleModeKey=0x47
ChordYawModeKey=0x48

[Rotation]
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
; 0.0 responsive - 1.0 heavy. A 0.15 floor is always applied internally.
Smoothing=0.0

[Position]
Enabled=1
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
InvertX=0
InvertY=0
InvertZ=0
; Travel limits in metres.
LimitX=0.30
LimitY=0.20
LimitZ=0.40
LimitZBack=0.10
Smoothing=0.15

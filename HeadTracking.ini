; Assetto Corsa EVO Head Tracking - configuration
; Edit values, restart the game to apply.
;
; Controls (all remappable, see [Hotkeys]):
;           End  / Ctrl+Shift+Y   toggle tracking
;           PgUp / Ctrl+Shift+G   cycle tracking mode (rotation and position
;                                 / rotation only / position only)

[Network]
UdpPort=4242

[General]
EnableOnStartup=1

[Hotkeys]
; Windows virtual key codes, in hex. Each action has a nav-cluster key and a
; Ctrl+Shift+<key> chord, and both fire it - remap either or both.
; Common codes: Home 0x24, End 0x23, Insert 0x2D, Delete 0x2E, PgUp 0x21,
; PgDn 0x22, F1-F12 0x70-0x7B, A-Z 0x41-0x5A, numpad 0-9 0x60-0x69.
ToggleKey=0x23
CycleModeKey=0x21
ChordToggleKey=0x59
ChordCycleModeKey=0x47

[Rotation]
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
; Smoothing covers rotation and position alike, and the value used is picked
; per connection from where the tracker sends from. 0.0 none .. 1.0 heavy.
; LocalSmoothing: tracker running on this machine (loopback). Nothing floors it,
; so 0.0 really is zero-latency tracking.
; RemoteSmoothing: tracker is a device on the network, e.g. a phone over WiFi.
LocalSmoothing=0.0
RemoteSmoothing=0.15

[Position]
Enabled=1
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
InvertX=0
InvertY=0
; InvertZ is for a tracker that sends depth backwards, not for a lean that
; feels reversed. It is applied before the LimitZ / LimitZBack clamp, so
; turning it on also swaps the travel budgets to 0.10m forward and 0.40m back.
InvertZ=0
; Travel limits in metres.
LimitX=0.30
LimitY=0.20
LimitZ=0.40
LimitZBack=0.10
